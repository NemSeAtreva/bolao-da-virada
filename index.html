<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bolão da Virada</title>
  <meta name="description" content="Bolão da Virada: jogue em grupo, aumente suas chances e compartilhe a emoção." />
  <meta property="og:title" content="Bolão da Virada" />
  <meta property="og:description" content="Jogue em grupo, aumente suas chances e compartilhe a emoção!" />
  <meta property="og:image" content="assets/banner.jpg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <div class="app">
    <div class="banner">
      <img src="assets/banner.jpg" width="1402" height="1122"
           alt="Bolão da Virada: participe do nosso bolão. Jogue em grupo, aumente suas chances e compartilhe a emoção. Garanta já seu número!" />
      <button class="icone-redondo dir" id="compartilhar" aria-label="Compartilhar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </div>

    <div class="cartao-titulo">
      <h1>Bolão da Virada: jogue em grupo e aumente suas chances!</h1>
      <div class="linha-verde">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Inscrições abertas
      </div>
      <p>Bolão é mais chance de ganhar. Escolha seu grupo e compartilhe a emoção da virada.</p>
    </div>

    <div class="conteudo">
      <div class="destaques">
        <div class="destaque"><strong>10</strong><span>grupos</span></div>
        <div class="destaque"><strong>+</strong><span>chances</span></div>
        <div class="destaque"><strong>1 min</strong><span>para entrar</span></div>
      </div>
    </div>
  </div>

  <div class="barra-fixa">
    <div class="dentro">
      <a class="btn-laranja" href="como-funciona.html">Participar</a>
    </div>
  </div>

  <script>
    document.getElementById("compartilhar").addEventListener("click", async () => {
      const dados = { title: document.title, url: location.href };
      if (navigator.share) { try { await navigator.share(dados); } catch (e) {} }
      else { navigator.clipboard?.writeText(location.href); }
    });
  </script>
</body>
</html>
