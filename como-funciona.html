<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolha seu grupo | Bolão da Virada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css?v=14" />
</head>
<body class="sem-barra">
  <main class="pagina">
    <img class="banner" src="assets/banner.jpg?v=2" width="1402" height="1122" alt="Bolão da Virada" />

    <section class="chamada">
      <h1 class="titulo">Agora é com você<br /><span class="ouro">escolhe seu grupo</span></h1>
      <p>Clicou, caiu na página da ação. Garante no mínimo <b>200 cotas</b> e pronto: você tá no bolão.</p>
    </section>

    <span class="seta">↓</span>
    <div class="grupos" id="grupos"></div>

    <a class="voltar" href="index.html">‹ Voltar para o início</a>
    <p class="aviso">Proibida a participação de menores de 18 anos.</p>
  </main>

  <script src="assets/config.js?v=2"></script>
  <script>
    const cfg = window.BOLAO_CONFIG;
    const lista = document.getElementById("grupos");

    cfg.grupos.forEach((g, i) => {
      const a = document.createElement("a");
      const temLink = g.link && g.link !== "#";
      a.className = "grupo" + (temLink ? "" : " pendente");
      a.href = temLink ? g.link : "#";
      if (temLink && cfg.abrirEmNovaAba) { a.target = "_blank"; a.rel = "noopener"; }
      if (!temLink) {
        a.addEventListener("click", (e) => e.preventDefault());
        a.title = "Link ainda não configurado";
      }
      a.innerHTML = `
        <span class="g-rotulo">GRUPO</span>
        <span class="g-num">${String(i + 1).padStart(2, "0")}</span>
        <span class="g-cta">${temLink ? "Participar" : "Em breve"}</span>`;
      lista.appendChild(a);
    });
  </script>
</body>
</html>
