<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolha seu grupo | Bolão da Virada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css?v=4" />
</head>
<body>
  <div class="app">
    <header class="topo">
      <a class="marca" href="index.html">BOLÃO DA VIRADA</a>
      <a class="voltar" href="index.html">‹ Voltar</a>
    </header>

    <img class="banner" src="assets/banner.jpg" width="1402" height="1122" alt="Bolão da Virada" />

    <section class="bloco">
      <h1>Escolha seu grupo</h1>
      <p>Ao clicar, você vai para a página da ação. Lembre-se: o pedido mínimo é de <b>200 cotas</b>.</p>
    </section>

    <section class="bloco">
      <div class="grupos" id="grupos"></div>
    </section>

    <p class="aviso">Proibida a participação de menores de 18 anos.</p>
  </div>

  <script src="assets/config.js?v=2"></script>
  <script>
    const cfg = window.BOLAO_CONFIG;
    const lista = document.getElementById("grupos");

    cfg.grupos.forEach((g) => {
      const a = document.createElement("a");
      const temLink = g.link && g.link !== "#";
      a.className = "grupo" + (temLink ? "" : " pendente");
      a.href = temLink ? g.link : "#";
      if (temLink && cfg.abrirEmNovaAba) { a.target = "_blank"; a.rel = "noopener"; }
      if (!temLink) {
        a.addEventListener("click", (e) => e.preventDefault());
        a.title = "Link ainda não configurado";
      }
      a.innerHTML = `
        <span class="g-nome">${g.nome}</span>
        <span class="g-cta">${temLink ? "Participar" : "Em breve"}</span>`;
      lista.appendChild(a);
    });
  </script>
</body>
</html>
