<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escolha seu grupo | Bolão da Virada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,600;0,700;0,900;1,900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css?v=7" />
</head>
<body>
  <header class="topo">
    <div class="dentro">
      <a class="marca" href="index.html">BOLÃO DA <span>VIRADA</span></a>
      <a class="voltar" href="index.html">‹ Voltar</a>
    </div>
  </header>
  <div class="alerta">Compre pelo link do seu grupo, com no mínimo <b>200 cotas</b>, para entrar no bolão.</div>

  <div class="app">
    <div class="capa">
      <img src="assets/banner.jpg?v=2" width="1402" height="1122" alt="Bolão da Virada" />
      <div class="legenda">
        <h1>Escolha seu grupo</h1>
        <div class="sub">Você vai direto para a página da ação</div>
      </div>
    </div>

    <div class="conteudo">
      <h2>Grupos disponíveis</h2>
      <div class="grupos" id="grupos"></div>

      <p class="aviso">Proibida a participação de menores de 18 anos.</p>
    </div>
  </div>

  <script src="assets/config.js?v=2"></script>
  <script>
    const cfg = window.BOLAO_CONFIG;
    const lista = document.getElementById("grupos");

    cfg.grupos.forEach((g, i) => {
      const a = document.createElement("a");
      const temLink = g.link && g.link !== "#";
      a.className = "grupo" + (temLink ? "" : " pendente");
      a.href = temLink ? g.link : "#";
      if (temLink && cfg.abrirEmNovaAba) { a.target = "_blank"; a.rel = "noopener"; }
      if (!temLink) {
        a.addEventListener("click", (e) => e.preventDefault());
        a.title = "Link ainda não configurado";
      }
      a.innerHTML = `
        <span class="g-rotulo">GRUPO</span>
        <span class="g-num">${String(i + 1).padStart(2, "0")}</span>
        <span class="g-premio">Concorre a <b>R$ 50 mil</b></span>
        <span class="g-cta">${temLink ? "Participar" : "Em breve"}</span>`;
      lista.appendChild(a);
    });
  </script>
</body>
</html>
